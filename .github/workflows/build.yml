name: Build TextScale Multi-Platform

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. WINDOWS 64-BIT BUILD & INSTALLER EXE
  # ==========================================
  build-windows:
    name: Windows x64 Build
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DOBS_INCLUDE_DIR="${{ github.workspace }}/obs-src/libobs" `
            -DOBS_LIB_DIR="${{ github.workspace }}/obs-src/libobs"

      - name: Compile TextScale Plugin
        run: |
          cmake --build build --config Release

      - name: Run Unit Tests
        run: |
          .\build\test_math.exe

      - name: Generate Installer Setup EXE
        run: |
          python installer/build_installer.py
          cl.exe /O2 /EHsc /std:c++17 /Fe:TextScale-Setup.exe installer/setup.cpp user32.lib shell32.lib advapi32.lib

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          mkdir dist\text-scale\bin\64bit -Force
          mkdir dist\text-scale\data\locale -Force
          copy build\text-scale.dll dist\text-scale\bin\64bit\
          copy data\text_scale.effect dist\text-scale\data\
          copy data\locale\en-US.ini dist\text-scale\data\locale\
          copy TextScale-Setup.exe dist\
          Compress-Archive -Path dist\* -DestinationPath dist\TextScale-Windows-x64.zip -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TextScale-Windows-x64
          path: dist/

  # ==========================================
  # 2. UBUNTU LINUX BUILD (.DEB & .ZIP)
  # ==========================================
  build-linux:
    name: Ubuntu Linux x64 Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config libobs-dev zip

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DOBS_INCLUDE_DIR="${{ github.workspace }}/obs-src/libobs"

      - name: Compile Linux Plugin
        run: |
          cmake --build build --config Release

      - name: Run Unit Tests
        run: |
          ./build/test_math

      - name: Package Linux Artifacts (.deb and .zip)
        run: |
          # 1. Package .zip
          mkdir -p dist/text-scale/bin/64bit
          mkdir -p dist/text-scale/data/locale
          cp build/text-scale.so dist/text-scale/bin/64bit/
          cp data/text_scale.effect dist/text-scale/data/
          cp data/locale/en-US.ini dist/text-scale/data/locale/
          cd dist && zip -r ../text-scale-linux-x64.zip text-scale && cd ..

          # 2. Package .deb installer
          mkdir -p deb-root/DEBIAN
          mkdir -p deb-root/usr/lib/obs-plugins
          mkdir -p deb-root/usr/share/obs/obs-plugins/text-scale/locale
          cp build/text-scale.so deb-root/usr/lib/obs-plugins/
          cp data/text_scale.effect deb-root/usr/share/obs/obs-plugins/text-scale/
          cp data/locale/en-US.ini deb-root/usr/share/obs/obs-plugins/text-scale/locale/

          cat << 'EOF' > deb-root/DEBIAN/control
Package: obs-text-scale
Version: 1.0.0
Section: video
Priority: optional
Architecture: amd64
Maintainer: kubolive <kubolive@users.noreply.github.com>
Description: TextScale - Native OBS Studio text condensing filter
 An advanced horizontal text scaling and automatic condensation filter for OBS Studio.
EOF

          dpkg-deb --build deb-root text-scale-linux-x64.deb
          mkdir -p linux-dist
          cp text-scale-linux-x64.deb linux-dist/
          cp text-scale-linux-x64.zip linux-dist/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TextScale-Linux-x64
          path: linux-dist/

  # ==========================================
  # 3. MACOS BUILD (.PKG & .ZIP)
  # ==========================================
  build-macos:
    name: macOS Universal Build
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup macOS Dependencies
        run: |
          brew install cmake ninja

      - name: Configure CMake
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DOBS_INCLUDE_DIR="${{ github.workspace }}/obs-src/libobs"

      - name: Compile macOS Plugin
        run: |
          cmake --build build --config Release

      - name: Package macOS Artifacts (.pkg and .zip)
        run: |
          mkdir -p macos-dist
          # 1. Package .zip
          cd build && zip -r ../macos-dist/text-scale-macos-universal.zip text-scale.plugin && cd ..

          # 2. Package .pkg installer
          mkdir -p pkg-root
          cp -R build/text-scale.plugin pkg-root/
          pkgbuild --root pkg-root \
                   --install-location "/Library/Application Support/obs-studio/plugins" \
                   --identifier "com.kubolive.obs-text-scale" \
                   --version "1.0.0" \
                   macos-dist/text-scale-macos-universal.pkg

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TextScale-macOS-Universal
          path: macos-dist/

  # ==========================================
  # 4. AUTOMATED GITHUB RELEASE (TAG PUSH)
  # ==========================================
  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            TextScale-Windows-x64/TextScale-Setup.exe
            TextScale-Windows-x64/TextScale-Windows-x64.zip
            TextScale-macOS-Universal/text-scale-macos-universal.pkg
            TextScale-macOS-Universal/text-scale-macos-universal.zip
            TextScale-Linux-x64/text-scale-linux-x64.deb
            TextScale-Linux-x64/text-scale-linux-x64.zip
